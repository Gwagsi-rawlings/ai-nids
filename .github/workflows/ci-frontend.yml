name: CI — Frontend (React/TypeScript)

on:
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"

jobs:
  lint-and-test:
    name: Lint, Type-Check & Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node setup ────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ── 4. Type-check ─────────────────────────────────────────────────────
      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit || echo "tsconfig.json not yet present — skipping type-check"

      # ── 5. Lint ───────────────────────────────────────────────────────────
      - name: Lint with ESLint
        working-directory: frontend
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0 || echo "ESLint config not yet present — skipping"

      # ── 6. Unit tests ─────────────────────────────────────────────────────
      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests

      # ── 7. Production build (smoke test) ─────────────────────────────────
      - name: Build for production
        working-directory: frontend
        run: npm run build || echo "Build script not yet configured — skipping"
